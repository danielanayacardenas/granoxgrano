  <text x="84" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="0.04em" fill="#F5EBD6">Grano x Grano</text>
  <text x="84" y="240" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="7" letter-spacing="0.1em" fill="#F5EBD6" opacity="0.8">EL ORIGEN</text>
