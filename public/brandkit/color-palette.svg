<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#ECE2CC"/>
  
  <!-- Title -->
  <text x="20" y="35" font-family="Georgia, serif" font-size="18" font-weight="500" letter-spacing="0.05em" fill="#191713">COLOR SYSTEM</text>
  
  <!-- Primary Colors -->
  <text x="20" y="65" font-family="Helvetica Neue, sans-serif" font-size="10" letter-spacing="0.15em" fill="#3D3A33">PRIMARY</text>
  
  <!-- Paper -->
  <rect x="20" y="80" width="80" height="80" fill="#ECE2CC" stroke="#191713" stroke-width="0.5"/>
  <text x="20" y="175" font-family="Helvetica Neue, sans-serif" font-size="9" fill="#191713">Paper</text>
  <text x="20" y="187" font-family="monospace" font-size="8" fill="#3D3A33">#ECE2CC</text>
  
  <!-- Ink -->
  <rect x="110" y="80" width="80" height="80" fill="#191713"/>
  <text x="110" y="175" font-family="Helvetica Neue, sans-serif" font-size="9" fill="#191713">Ink</text>
  <text x="110" y="187" font-family="monospace" font-size="8" fill="#3D3A33">#191713</text>
  
  <!-- Brown -->
  <rect x="200" y="80" width="80" height="80" fill="#5A2E14"/>
  <text x="200" y="175" font-family="Helvetica Neue, sans-serif" font-size="9" fill="#191713">Brown</text>
  <text x="200" y="187" font-family="monospace" font-size="8" fill="#3D3A33">#5A2E14</text>
  
  <!-- Cream -->
  <rect x="290" y="80" width="80" height="80" fill="#F5EBD6"/>
  <text x="290" y="175" font-family="Helvetica Neue, sans-serif" font-size="9" fill="#191713">Cream</text>
  <text x="290" y="187" font-family="monospace" font-size="8" fill="#3D3A33">#F5EBD6</text>
  
  <!-- Story Colors -->
  <text x="20" y="220" font-family="Helvetica Neue, sans-serif" font-size="10" letter-spacing="0.15em" fill="#3D3A33">STORY ACCENTS</text>
  
  <!-- Gaia -->
  <rect x="20" y="235" width="60" height="40" rx="4" fill="#6A3A1E"/>
  <text x="20" y="290" font-family="Helvetica Neue, sans-serif" font-size="8" fill="#191713">Gaia</text>
  
  <!-- Aura -->
  <rect x="90" y="235" width="60" height="40" rx="4" fill="#7E8891"/>
  <text x="90" y="290" font-family="Helvetica Neue, sans-serif" font-size="8" fill="#191713">Aura</text>
  
  <!-- Helios -->
  <rect x="160" y="235" width="60" height="40" rx="4" fill="#6E1B30"/>
  <text x="160" y="290" font-family="Helvetica Neue, sans-serif" font-size="8" fill="#191713">Helios</text>
  
  <!-- Aether -->
  <rect x="230" y="235" width="60" height="40" rx="4" fill="#103E4E"/>
  <text x="230" y="290" font-family="Helvetica Neue, sans-serif" font-size="8" fill="#191713">Aether</text>
</svg>
